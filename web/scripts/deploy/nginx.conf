
#user  nobody;
worker_processes 1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
  worker_connections 1024;
}


http {
  include mime.types;
  default_type application/octet-stream;

  types {
    application/javascript  js mjs;
    text/css                css;
    text/html               html;
  }

  sendfile on;
  # tcp_nopush     on;

  #keepalive_timeout  0;
  # keepalive_timeout 65;

  # gzip on;
  # gzip_buffers 32 16k;
  # gzip_comp_level 6;
  # gzip_min_length 1k;
  # gzip_static on;
  # gzip_types text/plain
  #   text/css
  #   application/javascript
  #   application/json
  #   application/x-javascript
  #   text/xml
  #   application/xml
  #   application/xml+rss
  #   text/javascript; #设置压缩的文件类型
  # gzip_vary on;

  server {
    listen 8080;
    server_name localhost;

    # 反向代理 API 请求到后端 Go 服务
    location /api/ {
      proxy_pass http://backend:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # WebSocket 支持（聊天功能需要）
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 86400;
    }

    # 客户端安装包下载（静态文件）
    # 将 starfire.rar / starfire.zip / starfire.tar.gz 等文件放入 /var/www/starfire/download/ 目录
    location /download/ {
      alias /var/www/starfire/download/;  # 末尾必须加 /！确保路径拼接正确
      # 强制触发下载：添加 Content-Disposition 头，文件名自动取原文件名
      add_header Content-Disposition "attachment; filename=\"$arg_filename\"";
      # 可选优化：限制下载速度（避免带宽占用过高，如 200k/s，单位 k=千字节，m=兆字节）
      limit_rate 200k;
      # 可选安全：禁止目录浏览（避免用户看到目录内所有文件列表）
      autoindex off;
      # 可选：允许断点续传（Nginx 默认支持，添加以下指令明确开启）
      expires off;  # 关闭缓存，确保每次下载都是最新文件
      add_header Accept-Ranges bytes;  # 支持 HTTP 范围请求（断点续传）
      # 常见压缩包 MIME 类型
      types {
        application/x-rar-compressed rar;
        application/zip zip;
        application/gzip gz tgz;
        application/x-gzip tar.gz;
        application/octet-stream exe dmg;
      }
      default_type application/octet-stream;
      try_files $uri =404;
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
      index index.html;
      # Enable CORS
      add_header 'Access-Control-Allow-Origin' '*';
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
      add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';
      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain charset=UTF-8';
        add_header 'Content-Length' 0;
        return 204;
      }
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
  }
}
