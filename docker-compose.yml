version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: dockerfile
    container_name: starfire-backend
    restart: unless-stopped
    ports:
      - "8081:8080"
    networks:
      - starfire-net

  frontend:
    build:
      context: ./web
      dockerfile: scripts/deploy/Dockerfile
    container_name: starfire-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - starfire-net

networks:
  starfire-net:
    driver: bridge
